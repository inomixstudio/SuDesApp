name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Gitleaks: pemindai secret penuh (lebih tajam dari pola manual di bawah).
      - name: Pindai secret dengan Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Scan tracked files for secrets
        shell: pwsh
        run: |
          $patterns = @(
            'BEGIN (RSA |EC )?PRIVATE KEY',
            'SUPABASE_DB_PASSWORD\s*[=:]\s*["'']?[A-Za-z0-9_-]{12,}',
            'MIDTRANS_SERVER_KEY\s*[=:]\s*["'']?[A-Za-z0-9_-]{12,}'
          )
          $files = git ls-files
          foreach ($pattern in $patterns) {
            $matches = $files | ForEach-Object {
              Select-String -Path $_ -Pattern $pattern -ErrorAction SilentlyContinue
            }
            if ($matches) {
              $matches | ForEach-Object { Write-Error "Potential secret: $($_.Path):$($_.LineNumber)" }
              throw "Secret scan failed. Store credentials only in ignored local files or CI secrets."
            }
          }

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.100

      - name: Restore solution
        run: dotnet restore SuDesApp.slnx

      - name: Build solution
        run: dotnet build SuDesApp.slnx --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test SuDesApp.Tests/SuDesApp.Tests.csproj --no-build --no-restore --configuration Release

      # Uji E2E trial server: menyalakan server lisensi lokal (mode memori)
      # lalu menjalankan harness klien Tools/UjiTrialServerE2E — alur pendaftaran
      # desa, permintaan trial, token bertanda tangan, dan penolakan trial
      # perangkat kedua teruji otomatis di setiap push.
      # Runner Windows memakai pwsh secara bawaan, jadi shell: bash eksplisit
      # agar skripnya dijalankan di Git Bash seperti di mesin pengembang.
      - name: Uji E2E trial server
        shell: bash
        timeout-minutes: 10
        run: bash Tools/uji-e2e-trial-server.sh

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install JDK 21
        uses: actions/setup-java@387ac29b308b003ca37ba93a6cab5eb57c8f5f93 # v4.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Gradle (wrapper)
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      # Kunci Supabase hanya dipakai saat rilis; build debug tanpa
      # supabase.properties tetap sah (BuildConfig berisi string kosong) dan
      # sudah cukup membuktikan kode Kotlin, resource, dan manifest kompilasi.
      - name: Bangun APK debug
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Uji unit Android
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain
