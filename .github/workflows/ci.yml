name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gitleaks: pemindai secret penuh (lebih tajam dari pola manual di bawah).
      - name: Pindai secret dengan Gitleaks
        uses: gitleaks/gitleaks-action@v3

      - name: Scan tracked files for secrets
        shell: pwsh
        run: |
          $patterns = @(
            'BEGIN (RSA |EC )?PRIVATE KEY',
            'SUPABASE_DB_PASSWORD\s*[=:]\s*["'']?[A-Za-z0-9_-]{12,}',
            'MIDTRANS_SERVER_KEY\s*[=:]\s*["'']?[A-Za-z0-9_-]{12,}'
          )
          $files = git ls-files
          foreach ($pattern in $patterns) {
            $matches = $files | ForEach-Object {
              Select-String -Path $_ -Pattern $pattern -ErrorAction SilentlyContinue
            }
            if ($matches) {
              $matches | ForEach-Object { Write-Error "Potential secret: $($_.Path):$($_.LineNumber)" }
              throw "Secret scan failed. Store credentials only in ignored local files or CI secrets."
            }
          }

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100

      - name: Restore solution
        run: dotnet restore SuDesApp.slnx

      - name: Build solution
        run: dotnet build SuDesApp.slnx --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test SuDesApp.Tests/SuDesApp.Tests.csproj --no-build --no-restore --configuration Release

      # Audit kontras tema: sebelas berkas tema wajib punya kunci yang sama
      # persis dan setiap pasangan teks/latar lolos WCAG AA (AAA untuk
      # HighContrast). Tanpa gerbang ini, tema baru bisa lolos build lalu
      # membuat teks tak terbaca — temuan yang pernah terjadi (lihat
      # docs/tema-dan-warna.md). Skripnya sudah ada dan dipakai manual; ini
      # mengalirkannya ke setiap push.
      - name: Audit kontras tema (WCAG)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File Tools/check-kontras-wcag.ps1

      # Uji E2E trial server: menyalakan server lisensi lokal (mode memori)
      # lalu menjalankan harness klien Tools/UjiTrialServerE2E — alur pendaftaran
      # desa, permintaan trial, token bertanda tangan, dan penolakan trial
      # perangkat kedua teruji otomatis di setiap push.
      # Runner Windows memakai pwsh secara bawaan, jadi shell: bash eksplisit
      # agar skripnya dijalankan di Git Bash seperti di mesin pengembang.
      - name: Uji E2E trial server
        shell: bash
        timeout-minutes: 10
        run: bash Tools/uji-e2e-trial-server.sh

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Gradle (wrapper)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Kunci Supabase hanya dipakai saat rilis; build debug tanpa
      # supabase.properties tetap sah (BuildConfig berisi string kosong) dan
      # sudah cukup membuktikan kode Kotlin, resource, dan manifest kompilasi.
      - name: Bangun APK debug
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Uji unit Android
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain
