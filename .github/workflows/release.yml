name: Release

# Rilis dari tag v<versi> atau manual (Run workflow). Seluruh urutan aset -
# publish, tanda tangan Authenticode, zip portable, installer, tambalan,
# patch.json, unggah - dikerjakan Tools/publish-release.ps1 supaya jalur CI dan
# jalur lokal tidak pernah berbeda.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versi:
        description: 'Versi rilis x.y.z (tag v<versi> harus sudah ada di origin)'
        required: true
        type: string
      tanpa_tanda_tangan:
        description: 'Lewati tanda tangan Authenticode (hanya untuk uji - aset tidak layak dibagikan)'
        required: false
        default: false
        type: boolean

  # Dipanggil workflow "Rilis Otomatis" setelah ia menaikkan versi, membuat tag
  # anotasi, dan mendorongnya. Dengan cara ini urutan build, tanda tangan, dan
  # unggah hanya ditulis sekali - jalur manual, tag, dan rilis otomatis memakai
  # langkah yang sama persis.
  workflow_call:
    inputs:
      versi:
        description: 'Versi rilis x.y.z (tag v<versi> sudah ada di origin)'
        required: true
        type: string
      tanpa_tanda_tangan:
        description: 'Lewati tanda tangan Authenticode (hanya untuk uji)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifikasi:
    name: Verifikasi (build + uji)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Bila dipanggil "Rilis Otomatis", commit kenaikan versi baru saja
          # sampai ke origin sehingga github.sha masih commit lama; bangun dari
          # tag rilis supaya yang diuji benar-benar isi rilisnya.
          ref: ${{ inputs.versi && format('refs/tags/v{0}', inputs.versi) || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore SuDesApp.slnx

      - name: Build
        run: dotnet build SuDesApp.slnx --no-restore --configuration Release

      - name: Uji
        run: dotnet test SuDesApp.Tests/SuDesApp.Tests.csproj --no-build --no-restore --configuration Release

  rilis:
    name: Publish, tanda tangan, unggah
    needs: verifikasi
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Riwayat dan tag lengkap: versi pembanding tambalan dibaca dari tag.
          fetch-depth: 0
          # Tag rilis, bukan commit cabang: lihat alasan di job verifikasi.
          ref: ${{ inputs.versi && format('refs/tags/v{0}', inputs.versi) || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      # Installer adalah aset utama bagi desa yang tidak mau mengekstrak ZIP,
      # jadi pemasangan Inno Setup harus terbukti menghasilkan ISCC.exe. Sebelum
      # ini jalurnya hanya memunculkan peringatan saat ISCC tidak ditemukan, dan
      # rilis terbit tanpa installer tanpa ada yang gagal.
      - name: Pasang Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = $null
          foreach ($akar in @("${env:ProgramFiles(x86)}", $env:ProgramFiles, (Join-Path $env:LOCALAPPDATA 'Programs'))) {
            $kandidat = @(Get-ChildItem -Path (Join-Path $akar 'Inno Setup*\ISCC.exe') -ErrorAction SilentlyContinue)
            if ($kandidat.Count -gt 0) {
              $iscc = ($kandidat | Sort-Object FullName -Descending | Select-Object -First 1).FullName
              break
            }
          }
          if (-not $iscc) {
            $perintah = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($perintah) { $iscc = $perintah.Source }
          }
          if (-not $iscc) { throw 'ISCC.exe tidak ditemukan setelah pemasangan Inno Setup 6 - instalasi gagal atau paket choco berubah jalur.' }
          Write-Host ("ISCC: " + $iscc)

      - name: Tentukan versi dan pembanding tambalan
        id: versi
        shell: pwsh
        env:
          INPUT_VERSI: ${{ inputs.versi }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $versi = if ($env:INPUT_VERSI) { $env:INPUT_VERSI } elseif ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { '' }
          $versi = $versi.Trim().TrimStart('v', 'V')
          if ($versi -notmatch '^\d+\.\d+\.\d+$') { throw "Versi tidak valid: '$versi' (harus x.y.z)." }

          $tag = 'v' + $versi
          if (-not (git ls-remote --tags origin ("refs/tags/" + $tag))) {
            throw "Tag $tag belum ada di origin. Buat dan dorong tag itu dulu - rilis GitHub menuntut tag yang menunjuk commit rilis."
          }

          # Pembanding tambalan: versi TERTUA yang lebih rendah dari versi ini,
          # bukan versi tepat sebelumnya. Perubahan berkas dari versi tertua sudah
          # mencakup perubahan semua versi sesudahnya, jadi satu tambalan melayani
          # pengguna yang tertinggal beberapa versi (2.8.x/2.9.x -> 2.10.1) tanpa
          # memasang versi perantara lebih dulu.
          $semua = @()
          foreach ($t in @(git tag --list 'v*')) {
            if ($t -match '^v(\d+\.\d+\.\d+)$' -and [version]$Matches[1] -lt [version]$versi) {
              $semua += $Matches[1]
            }
          }
          $semua = @($semua | Sort-Object { [version]$_ })
          $lama = if ($semua.Count -gt 0) { $semua[0] } else { '' }
          $dari = @($semua | Where-Object { $lama -and [version]$_ -ge [version]$lama }) -join ','

          "versi=$versi" >> $env:GITHUB_OUTPUT
          "versi_lama=$lama" >> $env:GITHUB_OUTPUT
          "dari_versi=$dari" >> $env:GITHUB_OUTPUT
          Write-Host ("Versi: {0}   pembanding: {1}   versi asal: {2}" -f $versi, $(if ($lama) { $lama } else { '(tidak ada)' }), $(if ($dari) { $dari } else { '(tidak ada)' }))

      - name: Siapkan pembanding tambalan dari tag bila belum tersedia
        shell: pwsh
        env:
          LAMA: ${{ steps.versi.outputs.versi_lama }}
        run: |
          # Rilis lama kadang tidak punya zip portable (hanya tag). Tanpa isi versi
          # asal, tambalan tidak bisa dibangun - jadi paketnya dibuat dari tag.
          if (-not $env:LAMA) { Write-Host 'Tanpa pembanding - tambalan dilewati.'; exit 0 }
          $zip = 'artifacts/SuDesApp_' + $env:LAMA + '_win-x64.zip'
          if (Test-Path -LiteralPath $zip) { Write-Host ('Pembanding sudah ada: ' + $zip); exit 0 }
          ./Tools/siapkan-pembanding.ps1 -Versi $env:LAMA

      - name: Terapkan konfigurasi lisensi produksi
        shell: pwsh
        env:
          LISENSI_URL_SERVER: ${{ secrets.LISENSI_URL_SERVER }}
          LISENSI_KUNCI_PUBLIK: ${{ secrets.LISENSI_KUNCI_PUBLIK }}
        run: |
          if (-not $env:LISENSI_URL_SERVER -or -not $env:LISENSI_KUNCI_PUBLIK) {
            throw 'Secret LISENSI_URL_SERVER dan LISENSI_KUNCI_PUBLIK wajib diisi (Settings -> Secrets and variables -> Actions).'
          }
          $jalur = 'appsettings.json'
          $json = Get-Content -LiteralPath $jalur -Raw | ConvertFrom-Json
          $json.Lisensi.UrlServer = $env:LISENSI_URL_SERVER.Trim()
          $json.Lisensi.KunciPublik = $env:LISENSI_KUNCI_PUBLIK.Trim()
          ($json | ConvertTo-Json -Depth 10) | Set-Content -LiteralPath $jalur -Encoding UTF8
          Write-Host ('Lisensi:UrlServer = ' + $json.Lisensi.UrlServer)

      - name: Siapkan sertifikat tanda tangan Authenticode
        id: sertifikat
        shell: pwsh
        env:
          LEWATI: ${{ inputs.tanpa_tanda_tangan }}
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ($env:LEWATI -eq 'true') {
            Write-Host 'Tanda tangan dilewati (tanpa_tanda_tangan=true) - aset TIDAK ditandatangani.' -ForegroundColor Yellow
            "pfx=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if (-not $env:PFX_BASE64) {
            throw 'Secret WINDOWS_SIGNING_PFX_BASE64 kosong. Aset tanpa Authenticode memicu peringatan SmartScreen di setiap pengguna baru; isi sertifikatnya atau jalankan workflow dengan tanpa_tanda_tangan=true untuk uji.'
          }
          $jalur = Join-Path $env:RUNNER_TEMP 'sudesapp-signing.pfx'
          [IO.File]::WriteAllBytes($jalur, [Convert]::FromBase64String($env:PFX_BASE64))
          "pfx=$jalur" >> $env:GITHUB_OUTPUT

      - name: Publish, tanda tangan, unggah aset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUDESAPP_PFX_PATH: ${{ steps.sertifikat.outputs.pfx }}
          SUDESAPP_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          VERSI: ${{ steps.versi.outputs.versi }}
          VERSI_LAMA: ${{ steps.versi.outputs.versi_lama }}
          DARI_VERSI: ${{ steps.versi.outputs.dari_versi }}
          REPO: ${{ github.repository }}
        run: |
          # CI tidak pernah memegang berkas rahasia kredensial Google (sengaja tidak
          # masuk repo maupun secrets), jadi paket CI selalu tanpa kredensial tertanam.
          # Status itu terbawa ke RELEASE.md; untuk paket yang langsung tersambung
          # Google, rilis dibuat lokal di komputer yang memiliki berkas rahasianya.
          $arg = @{
            Version                = $env:VERSI
            Repo                   = $env:REPO
            Unggah                 = $true
            WajibInstaller         = $true
            IzinkanTanpaKredensial = $true
          }
          if ($env:VERSI_LAMA) { $arg['VersiLama'] = $env:VERSI_LAMA }
          if ($env:DARI_VERSI) { $arg['DariVersi'] = $env:DARI_VERSI }
          ./Tools/publish-release.ps1 @arg
