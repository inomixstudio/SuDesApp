name: Release

# Rilis otomatis ke GitHub Releases:
#  - push tag versi (mis. `git tag v2.2.0 && git push origin v2.2.0`)
#  - atau jalankan manual (Actions → Release → Run workflow)
# Aset `SuDesApp_<versi>_Setup.exe` dipakai aplikasi sebagai sumber pembaruan
# (mode GitHub Releases), dan GitHub otomatis melampirkan digest sha256.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi tanpa prefix v (mis. 2.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tentukan versi
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}'
          }
          $v = $v.Trim().TrimStart('v', 'V')
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Format versi tidak valid: '$v' (harus x.y.z)"
          }
          $parts = @($v.Split('.')) + @('0')
          $asm = ($parts[0..3] -join '.')
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSEMBLY_VERSION=$asm" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Versi: $v (assembly $asm)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build + publish (self-contained win-x64)
        shell: pwsh
        run: >
          dotnet publish SuDesApp.Wpf/SuDesApp.Wpf.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=$env:VERSION
          -p:AssemblyVersion=$env:ASSEMBLY_VERSION
          -p:FileVersion=$env:ASSEMBLY_VERSION
          -o artifacts/publish

      - name: Paket portable (zip)
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/SuDesApp_${env:VERSION}_win-x64.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/installer | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe).Source }
          & $iscc "/DAppVersion=$env:VERSION" "installer\SuDesApp.iss"

      # Pembaruan kecil: bandingkan dengan hasil publish rilis sebelumnya supaya
      # pengguna yang sudah terpasang cukup mengunduh berkas yang berubah saja.
      - name: Paket pembaruan kecil (tambalan)
        shell: pwsh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ 'User-Agent' = 'SuDesApp-CI'; 'Accept' = 'application/vnd.github+json' }
          if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "Bearer $env:GITHUB_TOKEN" }

          $rilis = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=10"
          $sebelum = $rilis | Where-Object { $_.tag_name -notlike "*$env:VERSION*" -and -not $_.draft } | Select-Object -First 1
          if (-not $sebelum) { Write-Host 'Belum ada rilis sebelumnya - tambalan dilewati.'; exit 0 }

          $versiLama = $sebelum.tag_name.TrimStart('v', 'V')
          $zip = $sebelum.assets | Where-Object { $_.name -like 'SuDesApp_*_win-x64.zip' } | Select-Object -First 1
          if (-not $zip) { Write-Host 'Rilis sebelumnya tanpa zip portable - tambalan dilewati.'; exit 0 }

          Write-Host "Membandingkan dengan rilis $versiLama"
          Invoke-WebRequest -Headers $headers -Uri $zip.browser_download_url -OutFile artifacts/portable-lama.zip
          Expand-Archive -Path artifacts/portable-lama.zip -DestinationPath artifacts/publish-lama -Force

          # Ringkasan perbaikan untuk notifikasi di aplikasi: judul commit sejak tag lama.
          git fetch --tags --depth=200 2>$null
          $commit = git log --pretty=format:%s "v$versiLama..HEAD" 2>$null
          if (-not $commit) { $commit = git log -n 15 --pretty=format:%s }
          @($commit | Where-Object { $_ -and $_.Trim().Length -gt 0 } | Select-Object -First 20) |
            Set-Content -Path artifacts/RINGKASAN.txt -Encoding UTF8

          ./Tools/Buat-Tambalan.ps1 -Versi $env:VERSION -VersiLama $versiLama `
            -PublishBaru artifacts/publish -PublishLama artifacts/publish-lama `
            -Ringkasan artifacts/RINGKASAN.txt -Keluaran artifacts

      # Aset patch.json harus selalu ada: bila pembuatan tambalan dilewati/gagal,
      # manifest kecil ini memberi tahu aplikasi bahwa rilis memakai installer penuh.
      - name: Pastikan patch.json tersedia
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/patch.json)) {
            @{
              versi = $env:VERSION
              dariVersi = @()
              jenis = 'besar'
              ringkasan = @()
              berkasPatch = ''
              sha256Patch = ''
              berkas = @()
              berkasDihapus = @()
              catatan = 'Rilis ini memakai installer penuh.'
            } | ConvertTo-Json -Depth 5 | Set-Content -Path artifacts/patch.json -Encoding UTF8
          }

      - name: Catatan rilis + SHA-256
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installer/*.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer tidak ditemukan" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          @(
            "Rilis SuDesApp $env:VERSION.",
            "",
            "Aset installer: ``$($setup.Name)``",
            "",
            "SHA-256 ``$($setup.Name)``: ``$hash``"
          ) | Set-Content -Path artifacts/RELEASE.md -Encoding UTF8

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SuDesApp ${{ env.VERSION }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          body_path: artifacts/RELEASE.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/installer/*.exe
            artifacts/*.zip
            artifacts/patch.json
            artifacts/patch.json
